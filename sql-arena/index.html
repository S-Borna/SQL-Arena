<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/database.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lär dig SQL på riktigt – bli bra!" />
  <title>SQL Arena - Designed & Built by Said Borna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Shield Protection -->
  <script>
    // Disable right-click context menu
    document.addEventListener('contextmenu', e => e.preventDefault());

    // Disable keyboard shortcuts for DevTools
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'U') ||
        (e.metaKey && e.altKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.metaKey && e.key === 'U')) {
        e.preventDefault();
        return false;
      }
    });

    // DevTools detection
    (function () {
      const threshold = 160;
      const devtools = { open: false };

      setInterval(() => {
        const widthThreshold = window.outerWidth - window.innerWidth > threshold;
        const heightThreshold = window.outerHeight - window.innerHeight > threshold;

        if (widthThreshold || heightThreshold) {
          if (!devtools.open) {
            devtools.open = true;
            document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#09090b;color:#ef4444;font-family:Inter,sans-serif;font-size:24px;text-align:center;padding:20px;">⚠️ DevTools är inte tillåtet på denna sida</div>';
          }
        }
      }, 500);

      // Console detection
      const element = new Image();
      Object.defineProperty(element, 'id', {
        get: function () {
          devtools.open = true;
          document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#09090b;color:#ef4444;font-family:Inter,sans-serif;font-size:24px;text-align:center;padding:20px;">⚠️ DevTools är inte tillåtet på denna sida</div>';
        }
      });
      console.log(element);
    })();

    // Disable text selection
    document.addEventListener('selectstart', e => e.preventDefault());

    // Disable drag
    document.addEventListener('dragstart', e => e.preventDefault());

    // Disable copy
    document.addEventListener('copy', e => e.preventDefault());
  </script>
  <style>
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    input,
    textarea,
    [contenteditable="true"] {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }
  </style>
<script src="/assets/js/shield.js"></script>
</head>
